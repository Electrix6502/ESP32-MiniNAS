[platformio]
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = platformio/espressif32@6.10.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-mklittlefs@1.203.210628
board = mininas_s3_n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=1
    -I lib/libsmb2/include/smb2
extra_scripts = post:scripts/build_images.py
lib_ldf_mode = deep

